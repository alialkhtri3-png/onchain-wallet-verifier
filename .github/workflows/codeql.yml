name: "CodeQL Full Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0'  # تشغيل أسبوعيًا

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    strategy:
      matrix:
        language: [ "javascript", "typescript", "python", "java", "c-cpp", "csharp", "go" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Build project if required
        if: matrix.language == 'c-cpp' || matrix.language == 'java' || matrix.language == 'csharp' || matrix.language == 'go'
        run: |
          echo "Add your build commands here if your language requires compilation"
          # مثال: 
          # make
          # mvn package
          # dotnet build
          # go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4



