name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '45 22 * * 4'

permissions:
  contents: read         # ضروري للوصول للملفات
  security-events: write # ضروري لرفع نتائج CodeQL
  packages: read         # للوصول لحزم CodeQL الداخلية
  actions: read          # للوصول لبيئة GitHub Actions

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: 'javascript-typescript'
            build-mode: 'auto'
          - language: 'python'
            build-mode: 'auto'
          - language: 'go'
            build-mode: 'auto'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Build (if manual)
        if: matrix.build-mode == 'manual'
        run: |
          echo "ضع هنا أوامر البناء الخاصة بالمشروع إذا كانت لغة تتطلب build"
          exit 1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"

