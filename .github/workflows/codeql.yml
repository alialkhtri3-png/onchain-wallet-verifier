name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0'  # أسبوعياً يوم الأحد

permissions:
  contents: read
  security-events: write  # مهم لتتبع التنبيهات
  actions: read           # للوصول إلى الإعدادات الخاصة بالـ Actions

jobs:
  analyze:
    name: Analyze CodeQL
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [ "javascript", "typescript", "github-actions" ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild (if needed)
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3



