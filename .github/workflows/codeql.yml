name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '45 22 * * 4'

permissions:
  contents: read          # السماح بالوصول لملفات المستودع
  security-events: write  # السماح للـ workflow بكتابة نتائج CodeQL
  actions: read           # ضروري لتشغيل الـ workflow بشكل صحيح
  id-token: write         # مطلوب لبعض الوظائف الحديثة

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: 'javascript-typescript'
            build-mode: 'auto'
          - language: 'python'
            build-mode: 'auto'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Build project (if needed)
        if: matrix.build-mode == 'manual'
        run: |
          echo "Add commands to build your project if required"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

